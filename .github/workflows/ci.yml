name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testar API
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Verificar qualidade e formatação
        working-directory: frontend
        run: npm run lint && npm run format:check
      - name: Testar interface
        working-directory: frontend
        run: npm test
      - name: Gerar build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Subir aplicação
        run: docker compose up -d --build
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Executar jornadas E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar aplicação
        if: always()
        run: docker compose down -v
