services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solution_address_book}
      POSTGRES_USER: ${POSTGRES_USER:-solution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solution_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-solution} -d ${POSTGRES_DB:-solution_address_book}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [solution-network]

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-solution_address_book}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-solution}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-solution_dev_password}
      APP_JWT_SECRET: ${JWT_SECRET:-VGhpcy1pcy1hLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbi0yMDI2}
      APP_ADMIN_CPF: ${ADMIN_CPF:-52998224725}
      APP_ADMIN_NAME: ${ADMIN_NAME:-Administrador Solution}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [solution-network]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
    networks: [solution-network]

volumes:
  postgres_data:

networks:
  solution-network:
    driver: bridge
