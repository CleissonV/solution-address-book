spring:
  application:
    name: solution-address-book
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:5432/${PGDATABASE:solution_address_book}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:solution}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:solution_dev_password}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    cache-names: postalCodes
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=24h,recordStats
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET}}
    expiration: 8h
    issuer: solution-address-book
  admin:
    name: ${APP_ADMIN_NAME:Administrador Solution}
    cpf: ${APP_ADMIN_CPF:${ADMIN_CPF}}
    password: ${APP_ADMIN_PASSWORD:${ADMIN_PASSWORD}}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  viacep:
    base-url: https://viacep.com.br/ws
