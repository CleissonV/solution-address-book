spring:
  application:
    name: solution-address-book
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/solution_address_book}
    username: ${SPRING_DATASOURCE_USERNAME:solution}
    password: ${SPRING_DATASOURCE_PASSWORD:solution_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    cache-names: postalCodes
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=24h
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtaXQtaW4tcHJvZHVjdGlvbi0yMDI2}
    expiration: 8h
  admin:
    name: ${APP_ADMIN_NAME:Administrador Solution}
    cpf: ${APP_ADMIN_CPF:52998224725}
    password: ${APP_ADMIN_PASSWORD:Admin@123}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  viacep:
    base-url: https://viacep.com.br/ws
